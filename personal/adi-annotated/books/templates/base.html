{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Adi Annotated{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&family=Parisienne&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'main.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="site-nav">
        <a href="{% url 'index' %}" class="brand">
            <span class="brand-adi">Adi</span><span class="brand-annotated">Annotated</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" onclick="const l=document.getElementById('nav-links');const open=l.classList.toggle('open');this.setAttribute('aria-expanded',open);">Menu</button>
        <div class="nav-links" id="nav-links">
            <a href="#stories-reviews-list">Stories/Reviews</a>
            <a href="#">Sign In</a>
            <a href="#">Sign Up</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <nav class="footer-links" aria-label="Footer">
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>

        <div class="footer-divider"></div>

        <p class="footer-copy">&copy; {% now "Y" %} Adi Golos</p>
    </footer>
</body>
</html>
