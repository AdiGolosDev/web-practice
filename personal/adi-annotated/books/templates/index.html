{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'graph.css' %}">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
{% endblock %}

{% block content %}

<header id="timeline-header">
  <h1>Personal Reading History</h1>
  <p class="lede">Plunge into my past! Take a look at what I've been reading and when :P</p>
  <div class="legend">
    <span><i class="swatch swatch-fiction"></i>Fiction</span>
    <span><i class="swatch swatch-non-fiction"></i>Non-fiction</span>
  </div>
</header>

<main id="timeline-main">
  <div id="chart-wrap"></div>
</main>

<div id="tooltip"></div>

<script>
(async function () {
  // ---------------------------------------------------------------
  // 1. DATA
  // ---------------------------------------------------------------
  const res = await fetch('/api/books/');
  if (!res.ok) {
    console.error('Failed to load /api/books/:', res.status);
    return;
  }
  const raw = await res.json();

  const books = raw.map(b => {
    const [ry, rm] = b.date_read.split('-').map(Number);
    return { ...b, date_read: new Date(ry, rm - 1, 1) };
  });

  // ---------------------------------------------------------------
  // 2. SCALES
  // ---------------------------------------------------------------
  const margin = { top: 20, right: 40, bottom: 20, left: 40 };
  const today = new Date();
  const currentYear = today.getFullYear();

  // Month range: from the earliest book's read month, forward to the
  // current month, then reversed so the most recent month is at the top
  // (matches the x-axis convention of "most recent = further along").
  const earliestRead = d3.min(books, d => d.date_read);
  const cursor = new Date(earliestRead.getFullYear(), earliestRead.getMonth(), 1);
  const endCursor = new Date(currentYear, today.getMonth(), 1);

  const monthKeys = [];
  while (cursor <= endCursor) {
    monthKeys.push(`${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`);
    cursor.setMonth(cursor.getMonth() + 1);
  }
  monthKeys.reverse(); // most recent month first = top of the chart
  const yearTicks = monthKeys.filter(k => k.endsWith('-01'));

  const minYearHeight = 50;
  const availableHeight = Math.max(0, window.innerHeight - 600);
  const yearHeight = Math.max(minYearHeight, availableHeight / (monthKeys.length / 12));
  const monthBandHeight = yearHeight / 12;

  const pubYears = books.map(d => d.year_published);
  const minPubYear = d3.min(pubYears);
  const xDomain = [minPubYear, currentYear];

  const monthKey = d => `${d.date_read.getFullYear()}-${String(d.date_read.getMonth() + 1).padStart(2, '0')}`;

  const chartWidth = Math.min(window.innerWidth * 0.8, 1600);
  const width = Math.max(chartWidth, 320);
  const height = monthKeys.length * monthBandHeight;
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height;

  // originGap: the single shared "zero point" for both axes. The x-axis's
  // left edge and the y-axis's top edge both start exactly here, so they
  // meet at one clean corner — everything between the SVG's outer edge
  // and this corner is pure margin, and no dot/ring/gridline can render
  // before it, since it's baked into the scales' own ranges.
  const originGap = 40;

  const x = d3.scaleLinear().domain(xDomain).range([originGap, innerWidth]);
  const y = d3.scaleBand().domain(monthKeys).range([originGap, innerHeight + originGap]).padding(0.35);

  const GENRE_COLORS = {
    fiction: 'var(--wine)',
    non_fiction: 'var(--teal)',
  };
  const color = genre => GENRE_COLORS[genre] || '#999';

  // ---------------------------------------------------------------
  // 3. DRAW
  // ---------------------------------------------------------------
  const svg = d3.select('#chart-wrap')
    .append('svg')
      .attr('width', width)
      .attr('height', height + originGap + margin.top + margin.bottom)
      .style('opacity', 0);

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.append('g')
    .attr('class', 'axis')
    .call(d3.axisTop(x).tickFormat(d3.format('d')).ticks(8));

  // Plain axisLeft(y) — d3 auto-centers each tick at y(k) + bandwidth()/2
  // for a band scale. The gridlines below use that exact same formula,
  // so the label and its line always land on the same pixel.
  g.append('g')
    .attr('class', 'axis')
    .call(d3.axisLeft(y).tickValues(yearTicks).tickFormat(k => k.split('-')[0]));

  g.selectAll('.year-line')
    .data(yearTicks)
    .enter()
    .append('line')
      .attr('class', 'year-line')
      .attr('x1', 0)
      .attr('x2', innerWidth)
      .attr('y1', k => y(k) + y.bandwidth() / 2)
      .attr('y2', k => y(k) + y.bandwidth() / 2)
      .attr('stroke-width', 1)
      .style('opacity', 0.18);

  // ---------------------------------------------------------------
  // 4. ENTER ANIMATION — dots, then review rings
  // ---------------------------------------------------------------
  const sortedByRead = [...books].sort((a, b) => a.date_read - b.date_read);
  const stagger = Math.min(18, 1200 / Math.max(sortedByRead.length, 1));
  const dotDuration = 500;
  const phase1TotalMs = (sortedByRead.length - 1) * stagger + dotDuration;

  const tooltip = d3.select('#tooltip');

  const dots = g.selectAll('.book-dot')
    .data(sortedByRead)
    .enter()
    .append('circle')
      .attr('class', 'book-dot')
      .attr('cx', originGap)
      .attr('cy', d => y(monthKey(d)) + y.bandwidth() / 2)
      .attr('r', 4)
      .attr('fill', d => color(d.genre))
      .style('opacity', 0)
      .on('mousemove', (event, d) => {
        tooltip
          .style('opacity', 1)
          .style('left', `${event.clientX + 14}px`)
          .style('top', `${event.clientY + 10}px`)
          .html(`
            <div class="t-title">${d.title}</div>
            <div class="t-meta">Written by: ${d.author} · published in ${d.year_published}</div>
            <div class="t-meta">Genre: ${d.genre.replace('_', '-')}</div>
            <div class="t-meta">Finished reading: ${d3.timeFormat('%b %Y')(d.date_read)}</div>
            ${d.language ? `<div class="t-meta">Read the book in ${d.language}</div>` : ''}
          `);
      })
      .on('mouseleave', () => tooltip.style('opacity', 0))
      .on('click', (event, d) => {
        if (d.has_review) window.location.href = `/reviews/${d.review_slug}/`;
      });

  svg.transition().duration(300).style('opacity', 1);

  dots.transition()
    .delay((d, i) => i * stagger)
    .duration(dotDuration)
    .attr('cx', d => x(d.year_published))
    .style('opacity', 1);

  // Phase 2 — review rings. Ink Black, deliberately more distant from
  // the dot (r: 10 vs the dot's r: 4) and heavier stroke (2px), so a
  // reviewed book reads clearly at a glance.
  const withReview = books.filter(d => d.has_review);
  const ringRadius = 10;
  const ringStrokeWidth = 2;
  const ringDuration = 700;
  const ringStagger = Math.min(12, 800 / Math.max(withReview.length, 1));
  const orbitRadius = 16;
  const orbitTurns = 1.25;

  const rings = g.selectAll('.review-ring')
    .data(withReview)
    .enter()
    .append('circle')
      .attr('class', 'review-ring')
      .attr('r', ringRadius)
      .attr('fill', 'none')
      .attr('stroke', 'var(--ink)')
      .attr('stroke-width', ringStrokeWidth)
      .style('opacity', 0);

  rings.transition()
    .delay((d, i) => phase1TotalMs + i * ringStagger)
    .duration(ringDuration)
    .style('opacity', 1)
    .attrTween('cx', function (d) {
      const targetX = x(d.year_published);
      return t => {
        const angle = orbitTurns * 2 * Math.PI * (1 - t);
        const r = orbitRadius * (1 - t);
        return targetX + r * Math.cos(angle);
      };
    })
    .attrTween('cy', function (d) {
      const targetY = y(monthKey(d)) + y.bandwidth() / 2;
      return t => {
        const angle = orbitTurns * 2 * Math.PI * (1 - t);
        const r = orbitRadius * (1 - t);
        return targetY + r * Math.sin(angle);
      };
    });
})();
</script>

{% endblock %}
